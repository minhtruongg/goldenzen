<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoldenZen — Rezervace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#FAF6EF;--ink2:#F3EDE2;--ink3:#EBE2D3;
  --gold:#A0681A;--gold2:#C8852A;--gold3:#7A5010;
  --cream:#2E1F0A;--cream2:#4A3318;--cream3:#6B5035;
  --muted:#9A8468;--muted2:#C4AD8E;
  --border:rgba(160,104,26,0.18);--border2:rgba(160,104,26,0.4);
  --r:4px;
}
html{background:var(--ink)}
body{font-family:'DM Sans',sans-serif;background:var(--ink);color:var(--cream);min-height:100vh;font-size:17px;line-height:1.65;background-image:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(160,104,26,0.07) 0%,transparent 70%),radial-gradient(ellipse 40% 40% at 90% 80%,rgba(160,104,26,0.04) 0%,transparent 60%)}
.wrap{max-width:620px;margin:0 auto;padding:3rem 1.5rem 4rem}
.hdr{text-align:center;padding-bottom:2.5rem;margin-bottom:2.5rem;position:relative}
.hdr::after{content:'';display:block;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin-top:2.5rem}
.hdr-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem}
.lang-btn{display:flex;gap:4px;background:rgba(0,0,0,0.04);border:1px solid var(--border);border-radius:20px;padding:3px}
.lb{padding:4px 14px;border-radius:16px;font-size:15px;letter-spacing:.08em;cursor:pointer;border:none;background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;font-weight:500;transition:all .2s}
.lb.a{background:var(--gold);color:var(--ink);font-weight:500}
.eyebrow{font-size:15px;letter-spacing:.25em;text-transform:uppercase;color:var(--gold);margin-bottom:.75rem;font-weight:400}
.logo{font-family:'Playfair Display',serif;font-size:42px;font-weight:400;letter-spacing:.02em;color:var(--cream);line-height:1.1}
.logo em{font-style:italic;color:var(--gold2)}
.tagline{font-size:16px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:.75rem;font-weight:300}
.steps{display:flex;align-items:center;justify-content:center;gap:0;margin-bottom:2.5rem}
.step-i{display:flex;align-items:center;gap:8px}
.step-n{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:500;border:1px solid rgba(160,104,26,0.22);color:var(--muted);background:transparent;transition:all .3s;flex-shrink:0}
.step-n.a{border-color:var(--gold);color:var(--gold);background:rgba(160,104,26,0.1)}
.step-n.d{border-color:rgba(160,104,26,0.4);color:var(--gold3);background:rgba(160,104,26,0.12)}
.step-l{font-size:15px;letter-spacing:.05em;color:var(--muted);text-transform:uppercase}
.step-l.a{color:var(--cream2)}
.step-sep{width:32px;height:1px;background:rgba(160,104,26,0.12);margin:0 4px;flex-shrink:0}
.ttl{font-family:'Playfair Display',serif;font-size:26px;font-weight:400;color:var(--cream);margin-bottom:1.5rem;letter-spacing:.01em}
.ttl em{font-style:italic;color:var(--gold2)}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.cat-card{background:rgba(0,0,0,0.02);border:1px solid var(--border);border-radius:var(--r);padding:1.25rem 1.25rem 1rem;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.cat-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(160,104,26,0.06),transparent);opacity:0;transition:opacity .2s}
.cat-card:hover{border-color:var(--border2);transform:translateY(-2px)}
.cat-card:hover::before{opacity:1}
.cat-icon{font-size:22px;margin-bottom:.6rem;line-height:1}
.cat-n{font-size:15px;font-weight:500;color:var(--cream);margin-bottom:3px;letter-spacing:.01em}
.cat-d{font-size:15px;color:var(--muted);line-height:1.4}
.svc-row{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--border);border-radius:var(--r);padding:1rem 1.25rem;cursor:pointer;margin-bottom:6px;background:rgba(0,0,0,0.02);transition:all .18s}
.svc-row:hover{border-color:var(--border2);background:rgba(160,104,26,0.05)}
.svc-n{font-size:16px;color:var(--cream);font-weight:400;margin-bottom:3px}
.svc-m{font-size:16px;color:var(--muted)}
.svc-p{display:flex;flex-direction:column;align-items:flex-end;gap:2px;white-space:nowrap}
.svc-p-orig{font-size:14px;color:var(--muted);text-decoration:line-through;line-height:1}
.svc-p-sale{font-size:15px;font-weight:600;color:var(--gold);line-height:1}
.sale-badge{display:inline-block;font-size:12px;background:rgba(160,104,26,0.12);color:var(--gold2);border:1px solid rgba(160,104,26,0.25);border-radius:2px;padding:1px 6px;letter-spacing:.04em;font-weight:500;margin-top:2px}
.svc-variants{display:flex;gap:6px;flex-shrink:0}
.var-btn{border:1px solid var(--border);border-radius:var(--r);padding:8px 12px;cursor:pointer;background:transparent;font-family:'DM Sans',sans-serif;text-align:right;transition:all .18s;display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-width:90px}
.var-btn:hover{border-color:var(--gold);background:rgba(160,104,26,0.05)}
.var-dur{font-size:13px;color:var(--muted);letter-spacing:.04em}
.var-orig{font-size:13px;color:var(--muted);text-decoration:line-through;line-height:1}
.var-price{font-size:15px;font-weight:600;color:var(--gold);line-height:1}
.var-badge{font-size:11px;background:rgba(160,104,26,0.12);color:var(--gold2);border:1px solid rgba(160,104,26,0.25);border-radius:2px;padding:1px 5px;letter-spacing:.04em;font-weight:500}
.time-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(65px,1fr));gap:6px;margin-top:12px}
.t-slot{padding:8px 4px;font-size:16px;text-align:center;border:1px solid var(--border);border-radius:var(--r);cursor:pointer;background:transparent;color:var(--muted);transition:all .12s;font-family:'DM Sans',sans-serif;letter-spacing:.02em}
.t-slot:hover{border-color:var(--border2);color:var(--cream2)}
.t-slot.sel{background:rgba(160,104,26,0.12);border-color:var(--gold);color:var(--gold);font-weight:500}
.panel{background:rgba(0,0,0,0.02);border:1px solid var(--border);border-radius:var(--r);padding:1.25rem}
.panel+.panel{margin-top:10px}
.panel-label{font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.75rem}
.notice{border:1px solid rgba(160,104,26,0.3);border-radius:var(--r);padding:.75rem 1rem;background:rgba(160,104,26,0.06);font-size:14px;color:var(--gold2);margin-bottom:1rem;line-height:1.5}
.summary{border:1px solid rgba(160,104,26,0.22);border-radius:var(--r);padding:1rem 1.25rem;background:rgba(160,104,26,0.04);margin-bottom:1.5rem}
.summary-svc{font-size:17px;color:var(--cream);margin-bottom:5px}
.summary-meta{font-size:16px;color:var(--muted);line-height:1.8}
.summary-price{display:flex;align-items:center;gap:10px;margin-top:4px}
.summary-orig{font-size:15px;color:var(--muted);text-decoration:line-through}
.summary-sale{font-size:17px;font-weight:600;color:var(--gold)}
.summary-badge{font-size:12px;background:rgba(160,104,26,0.12);color:var(--gold2);border:1px solid rgba(160,104,26,0.25);border-radius:2px;padding:2px 7px;letter-spacing:.04em;font-weight:500}
.fg{margin-bottom:14px}
.fl{font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:block}
.fi{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:var(--r);font-family:'DM Sans',sans-serif;font-size:16px;background:rgba(0,0,0,0.02);color:var(--cream);transition:border-color .15s;outline:none;-webkit-appearance:none;appearance:none}
.fi::placeholder{color:var(--muted2)}
.fi:focus{border-color:var(--gold)}
textarea.fi{min-height:80px;resize:vertical}
input[type="date"].fi::-webkit-calendar-picker-indicator{filter:invert(.6) sepia(1) saturate(2) hue-rotate(5deg)}
.btn{padding:11px 22px;border-radius:var(--r);cursor:pointer;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;letter-spacing:.04em;transition:all .18s;border:1px solid var(--border);background:transparent;color:var(--muted)}
.btn:hover{border-color:var(--border2);color:var(--cream2)}
.btn-gold{background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:500;letter-spacing:.06em;text-transform:uppercase;font-size:15px;padding:13px 28px}
.btn-gold:hover{background:var(--gold2);border-color:var(--gold2)}
.btn-sm{padding:7px 14px;font-size:16px}
.row-r{display:flex;justify-content:flex-end;margin-top:1.25rem}
.back-row{display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem}
.ok-wrap{text-align:center;padding:4rem 1rem 2rem}
.ok-ring{width:72px;height:72px;border-radius:50%;border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;margin:0 auto 2rem;background:rgba(160,104,26,0.07);font-size:24px;color:var(--gold)}
.ok-ttl{font-family:'Playfair Display',serif;font-size:30px;font-weight:400;color:var(--cream);margin-bottom:.75rem}
.ok-ref{font-size:15px;color:var(--muted);margin-bottom:.5rem}
.ok-ref strong{color:var(--gold);font-weight:500;letter-spacing:.06em}
.ok-note{font-size:15px;color:var(--muted);margin-bottom:2.5rem;max-width:320px;margin-left:auto;margin-right:auto;line-height:1.7}
.footer{margin-top:3rem;padding-top:1.5rem;position:relative;text-align:center;font-size:15px;color:var(--muted2);letter-spacing:.05em;line-height:2}
.footer::before{content:'';display:block;height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent);margin-bottom:1.5rem}
.msvc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.msvc-card{border:1px solid var(--border);border-radius:var(--r);padding:.9rem 1rem;background:rgba(0,0,0,0.02);display:flex;flex-direction:column;gap:6px}
.msvc-name{font-size:15px;color:var(--cream);font-weight:500;line-height:1.35;margin-bottom:2px}
.msvc-var{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border);border-radius:var(--r);padding:7px 10px;cursor:pointer;background:transparent;font-family:'DM Sans',sans-serif;width:100%;transition:all .15s}
.msvc-var:hover{border-color:var(--gold);background:rgba(160,104,26,0.07)}
.msvc-dur{font-size:13px;color:var(--muted);letter-spacing:.04em;white-space:nowrap}
.msvc-prices{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.msvc-orig{font-size:12px;color:var(--muted);text-decoration:line-through;line-height:1}
.msvc-price{font-size:14px;font-weight:600;color:var(--gold);line-height:1}
.svc-grp-hdr{font-size:13px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);margin-top:1.25rem;margin-bottom:6px;padding-left:2px;font-weight:500}
@media(max-width:500px){
  .logo{font-size:34px}
  .cat-grid{grid-template-columns:1fr 1fr}
  .msvc-grid{grid-template-columns:1fr}
  .steps .step-l{display:none}
  .steps .step-sep{width:16px}
  .wrap{padding:2rem 1.25rem 3rem}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const T={
  cs:{
    sub:"Wellness centrum · Praha 6",tagline:"Tělo & mysl v rovnováze",
    steps:["Kategorie","Služba","Datum & čas","Kontakt"],
    back:"← Zpět",cont:"Pokračovat",submit:"Odeslat rezervaci",newBook:"Nová rezervace",
    selDate:"Vyberte datum",times:"Dostupné časy",
    name:"Jméno a příjmení",phone:"Telefonní číslo",email:"E-mailová adresa",note:"Poznámka (volitelné)",
    namePh:"Jana Novák",phonePh:"123 456 789",emailPh:"jana@priklad.cz",notePh:"Přijdu s kamarádkou, mám specifické přání...",
    contactTtl:"Vaše kontaktní údaje",dateTimeTtl:"Vyberte termín",summaryLbl:"Vaše rezervace",
    okTtl:"Rezervace odeslána",okRef:"Referenční číslo",
    okNote:"Brzy vás budeme kontaktovat pro potvrzení vašeho termínu.",
    footer:"Bělohorská 118, Praha 6 – Břevnov\n+420 778 085 666\nPo–Pá 9:00–21:00 · So–Ne 10:00–21:00",
    priceOnReq:"Cena na dotaz",min:"min",sale:"-30%",
    bookingPaused:"Rezervace jsou dočasně pozastaveny do 10. 7. včetně. Nejbližší volný termín je 11. 7.",
    cats:[
      {id:"massage",icon:"♨",label:"Masáže",desc:"Thai, olejové, kamenné a další"},
      {id:"couple",icon:"◇",label:"Párová masáž",desc:"Relaxace pro dva"},
      {id:"cosm",icon:"✦",label:"Kosmetika",desc:"Líčení, ošetření pleti, depilace"},
      {id:"pmu",icon:"◈",label:"Permanentní makeup",desc:"Mikroblading, PMU obočí a rtů"},
      {id:"brows",icon:"◉",label:"Obočí & řasy",desc:"Laminace, prodlužování, lifting"},
      {id:"hair",icon:"✂",label:"Kadeřnictví",desc:"Střihy, barvení, ošetření vlasů"},
      {id:"nails",icon:"◆",label:"Nehty",desc:"Manikúra, pedikúra, gelové nehty"},
    ]
  },
  en:{
    sub:"Wellness centre · Prague 6",tagline:"Body & mind in balance",
    steps:["Category","Service","Date & time","Contact"],
    back:"← Back",cont:"Continue",submit:"Send booking",newBook:"New booking",
    selDate:"Select date",times:"Available times",
    name:"Full name",phone:"Phone number",email:"Email address",note:"Note (optional)",
    namePh:"Jane Smith",phonePh:"123 456 789",emailPh:"jane@example.com",notePh:"Coming with a friend, any special requests...",
    contactTtl:"Your contact details",dateTimeTtl:"Choose your slot",summaryLbl:"Your booking",
    okTtl:"Booking sent",okRef:"Reference number",
    okNote:"We'll contact you shortly to confirm your appointment.",
    footer:"Bělohorská 118, Prague 6 – Břevnov\n+420 778 085 666\nMon–Fri 9am–9pm · Sat–Sun 10am–9pm",
    priceOnReq:"Price on request",min:"min",sale:"-30%",
    bookingPaused:"Bookings are temporarily paused through 10 July. The earliest available date is 11 July.",
    cats:[
      {id:"massage",icon:"♨",label:"Massages",desc:"Thai, oil, hot stone & more"},
      {id:"couple",icon:"◇",label:"Couple massage",desc:"Relaxation for two"},
      {id:"cosm",icon:"✦",label:"Cosmetics",desc:"Makeup, skin treatments, waxing"},
      {id:"pmu",icon:"◈",label:"Permanent makeup",desc:"Microblading, PMU brows & lips"},
      {id:"brows",icon:"◉",label:"Brows & lashes",desc:"Lamination, extensions, lifting"},
      {id:"hair",icon:"✂",label:"Hairdressing",desc:"Cuts, colouring, hair treatments"},
      {id:"nails",icon:"◆",label:"Nails",desc:"Manicure, pedicure, gel nails"},
    ]
  }
};

let SVCS={};
let svcsLoaded=false;

function buildSvcsFromRows(rows){
  const byCategory={};
  for(const r of rows){
    const cat=r.category;
    if(!byCategory[cat])byCategory[cat]=[];
    const subKey=r.subgroup||"";
    const orig=(r.orig_price!=null)?r.orig_price:Math.round(r.price/0.7);
    let group=byCategory[cat].find(g=>g.name===r.name&&g.subKey===subKey);
    if(!group){
      group={name:r.name,cs:r.name,en:r.name_en||r.name,subKey:subKey,variants:[]};
      if(r.subgroup)group.grp={cs:r.subgroup,en:r.subgroup_en||r.subgroup};
      byCategory[cat].push(group);
    }
    group.variants.push({price:r.price,dur:r.duration,orig:orig});
  }
  const result={};
  for(const[cat,groups]of Object.entries(byCategory)){
    result[cat]=groups.map(g=>{
      const base={cs:g.cs,en:g.en};
      if(g.grp)base.grp=g.grp;
      if(g.variants.length>1)base.variants=g.variants;
      else{base.price=g.variants[0].price;base.dur=g.variants[0].dur;base.orig=g.variants[0].orig;}
      return base;
    });
  }
  return result;
}

async function loadServices(){
  try{
    const res=await fetch("/api/services");
    const json=await res.json();
    if(json.ok)SVCS=buildSvcsFromRows(json.services);
  }catch(e){console.error("Failed to load services",e);}
  svcsLoaded=true;
  render();
}

// Prices in SVCS are already after 30% discount. Original = price / 0.7
const S={step:1,lang:"cs",cat:null,svc:null,date:"",time:"",form:{name:"",phone:"",email:"",note:""},lastRef:""};

// Bookings are paused up through and including this date (YYYY-MM-DD).
// Earliest selectable date is the day after this.
const BOOKING_BLOCKED_THROUGH="2026-07-10";

function tx(){return T[S.lang]}
function pad(n){return String(n).padStart(2,"0")}
function earliestBookableDate(){
  const d=new Date(BOOKING_BLOCKED_THROUGH+"T00:00:00");
  d.setDate(d.getDate()+1);
  const t=today();
  const next=d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  return next>t?next:t;
}
function slots(ds){
  if(!ds)return[];
  const wk=[0,6].includes(new Date(ds+"T00:00:00").getDay());
  const r=[];
  for(let h=wk?10:9;h<21;h++){r.push(pad(h)+":00");if(h<20)r.push(pad(h)+":30")}
  if(ds===today()){
    const now=new Date();
    const nowMin=now.getHours()*60+now.getMinutes();
    return r.filter(tm=>{const[hh,mm]=tm.split(":").map(Number);return hh*60+mm>nowMin;});
  }
  return r;
}
function fmtD(d){if(!d)return"";return new Date(d+"T00:00:00").toLocaleDateString(S.lang==="cs"?"cs-CZ":"en-GB",{weekday:"long",day:"numeric",month:"long"})}
function fmtKc(p){return p.toLocaleString("cs-CZ")+" Kč"}
function origPrice(p){return Math.round(p/0.7)}
function today(){const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function mkRef(){return"GZ-"+Math.random().toString(36).slice(2,7).toUpperCase()}
function n(s){return s[S.lang]}

function el(tag,attr,...ch){
  const e=document.createElement(tag);
  for(const[k,v]of Object.entries(attr||{})){
    if(k==="cls")e.className=v;
    else if(k==="txt")e.textContent=v;
    else if(k==="htm")e.innerHTML=v;
    else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v);
  }
  for(const c of ch.flat()){
    if(c==null)continue;
    if(typeof c==="string"||typeof c==="number")e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  }
  return e;
}

// Price display: crossed original + sale price + badge
function priceEl(svc){
  const orig=svc.orig||origPrice(svc.price);
  const w=el("div",{cls:"svc-p"});
  w.appendChild(el("div",{cls:"svc-p-orig",txt:fmtKc(orig)}));
  w.appendChild(el("div",{cls:"svc-p-sale",txt:fmtKc(svc.price)}));
  w.appendChild(el("div",{cls:"sale-badge",txt:tx().sale}));
  return w;
}

function render(){const app=document.getElementById("app");app.innerHTML="";app.appendChild(view())}

function hdr(){
  const t=tx();
  return el("div",{cls:"hdr"},
    el("div",{cls:"hdr-top"},
      el("a",{href:"goldenzen.html",style:"font-size:14px;color:var(--muted);text-decoration:none;letter-spacing:.05em"},
        "← "+(S.lang==="cs"?"Zpět na web":"Back to website")
      ),
      el("div",{cls:"lang-btn"},
        el("button",{cls:"lb"+(S.lang==="cs"?" a":""),onclick:()=>{S.lang="cs";render()}},"CZ"),
        el("button",{cls:"lb"+(S.lang==="en"?" a":""),onclick:()=>{S.lang="en";render()}},"EN")
      )
    ),
    el("div",{cls:"eyebrow",txt:t.sub}),
    el("div",{cls:"logo",htm:"Golden<em>Zen</em>"}),
    el("div",{cls:"tagline",txt:t.tagline})
  );
}
function stepBar(){
  const w=el("div",{cls:"steps"});
  tx().steps.forEach((lbl,i)=>{
    const s=i+1,a=s===S.step,d=s<S.step;
    w.appendChild(el("div",{cls:"step-i"},
      el("div",{cls:"step-n"+(d?" d":a?" a":""),txt:d?"✓":String(s)}),
      el("span",{cls:"step-l"+(a?" a":""),txt:lbl})
    ));
    if(i<3)w.appendChild(el("div",{cls:"step-sep"}));
  });
  return w;
}

function view(){
  const w=el("div",{});
  w.appendChild(hdr());
  if(S.step<5)w.appendChild(stepBar());
  [null,s1,s2,s3,s4,s5][S.step]&&w.appendChild([null,s1,s2,s3,s4,s5][S.step]());
  if(S.step<5){
    const f=el("div",{cls:"footer"});
    tx().footer.split("\n").forEach((line,i)=>{f.appendChild(document.createTextNode(line));if(i<2)f.appendChild(el("br",{}))});
    w.appendChild(f);
  }
  return w;
}

function s1(){
  const w=el("div",{});
  w.appendChild(el("h2",{cls:"ttl",txt:tx().steps[0]}));
  const g=el("div",{cls:"cat-grid"});
  tx().cats.forEach(c=>{
    g.appendChild(el("div",{cls:"cat-card",onclick:()=>{S.cat=c;S.step=2;render()}},
      el("div",{cls:"cat-icon",txt:c.icon}),
      el("div",{cls:"cat-n",txt:c.label}),
      el("div",{cls:"cat-d",txt:c.desc})
    ));
  });
  w.appendChild(g);
  return w;
}

function s2(){
  const w=el("div",{});
  w.appendChild(el("div",{cls:"back-row"},
    el("button",{cls:"btn btn-sm",onclick:()=>{S.step=1;render()}},tx().back),
    el("h2",{cls:"ttl",style:"margin:0",txt:S.cat.label})
  ));
  const svcs=SVCS[S.cat.id]||[];
  if(!svcsLoaded){
    w.appendChild(el("div",{style:"text-align:center;padding:3rem 1rem;color:var(--muted)",
      txt:S.lang==="cs"?"Načítání služeb...":"Loading services..."}));
    return w;
  }
  if(S.cat.id==="massage" || S.cat.id==="couple"){
    // Card grid layout: easier to scan massages at a glance
    const g=el("div",{cls:"msvc-grid"});
    svcs.forEach(s=>{
      const card=el("div",{cls:"msvc-card"});
      card.appendChild(el("div",{cls:"msvc-name",txt:n(s)}));
      const variants=s.variants||[{dur:s.dur,price:s.price,orig:s.orig||origPrice(s.price)}];
      variants.forEach(v=>{
        const btn=el("button",{cls:"msvc-var",onclick:()=>{
          S.svc={cs:s.cs,en:s.en,dur:v.dur,price:v.price,orig:v.orig};
          S.step=3;render();
        }});
        btn.appendChild(el("span",{cls:"msvc-dur",txt:v.dur+" "+tx().min}));
        const pr=el("div",{cls:"msvc-prices"});
        pr.appendChild(el("span",{cls:"msvc-orig",txt:fmtKc(v.orig)}));
        pr.appendChild(el("span",{cls:"msvc-price",txt:fmtKc(v.price)}));
        btn.appendChild(pr);
        card.appendChild(btn);
      });
      g.appendChild(card);
    });
    w.appendChild(g);
  } else {
    svcs.forEach(s=>{
      if(s.grp)w.appendChild(el("div",{cls:"svc-grp-hdr",txt:s.grp[S.lang]}));
      if(s.variants){
        const row=el("div",{cls:"svc-row",style:"cursor:default"});
        row.appendChild(el("div",{},el("div",{cls:"svc-n",txt:n(s)})));
        const vw=el("div",{cls:"svc-variants"});
        s.variants.forEach(v=>{
          const btn=el("button",{cls:"var-btn",onclick:()=>{
            S.svc={cs:s.cs,en:s.en,dur:v.dur,price:v.price,orig:v.orig};
            S.step=3;render();
          }});
          btn.appendChild(el("div",{cls:"var-dur",txt:v.dur+" "+tx().min}));
          btn.appendChild(el("div",{cls:"var-orig",txt:fmtKc(v.orig)}));
          btn.appendChild(el("div",{cls:"var-price",txt:fmtKc(v.price)}));
          btn.appendChild(el("div",{cls:"var-badge",txt:tx().sale}));
          vw.appendChild(btn);
        });
        row.appendChild(vw);
        w.appendChild(row);
      } else {
        w.appendChild(el("div",{cls:"svc-row",onclick:()=>{S.svc=s;S.step=3;render()}},
          el("div",{},el("div",{cls:"svc-n",txt:n(s)}),el("div",{cls:"svc-m",txt:s.dur+" "+tx().min})),
          priceEl(s)
        ));
      }
    });
  }
  return w;
}

function s3(){
  const w=el("div",{});
  w.appendChild(el("div",{cls:"back-row"},
    el("button",{cls:"btn btn-sm",onclick:()=>{S.step=2;render()}},tx().back),
    el("h2",{cls:"ttl",style:"margin:0",txt:tx().dateTimeTtl})
  ));
  w.appendChild(el("div",{cls:"notice",txt:tx().bookingPaused}));
  const earliest=earliestBookableDate();
  const dp=el("div",{cls:"panel"});
  dp.appendChild(el("div",{cls:"panel-label",txt:tx().selDate}));
  if(S.date&&S.date<earliest){S.date="";S.time="";}
  const di=el("input",{cls:"fi",type:"date",min:earliest});
  di.value=S.date||"";
  di.addEventListener("input",()=>{if(di.value&&di.value<earliest){di.value=earliest;}S.date=di.value;S.time="";render()});
  dp.appendChild(di);
  w.appendChild(dp);
  if(S.date){
    const tp=el("div",{cls:"panel"});
    tp.appendChild(el("div",{cls:"panel-label",txt:tx().times+" · "+fmtD(S.date)}));
    const tg=el("div",{cls:"time-grid"});
    slots(S.date).forEach(tm=>{
      tg.appendChild(el("button",{cls:"t-slot"+(S.time===tm?" sel":""),txt:tm,onclick:()=>{S.time=tm;render()}}));
    });
    tp.appendChild(tg);
    w.appendChild(tp);
    if(S.time)w.appendChild(el("div",{cls:"row-r"},el("button",{cls:"btn btn-gold",onclick:()=>{S.step=4;render()}},tx().cont)));
  }
  return w;
}

function s4(){
  const w=el("div",{});
  w.appendChild(el("div",{cls:"back-row"},
    el("button",{cls:"btn btn-sm",onclick:()=>{S.step=3;render()}},tx().back),
    el("h2",{cls:"ttl",style:"margin:0",txt:tx().contactTtl})
  ));
  const sum=el("div",{cls:"summary"});
  sum.appendChild(el("div",{cls:"panel-label",txt:tx().summaryLbl}));
  sum.appendChild(el("div",{cls:"summary-svc",txt:n(S.svc)}));
  sum.appendChild(el("div",{cls:"summary-meta",txt:fmtD(S.date)+" · "+S.time+" · "+S.svc.dur+" "+tx().min}));
  // Price row with strikethrough + sale
  const pr=el("div",{cls:"summary-price"});
  pr.appendChild(el("span",{cls:"summary-orig",txt:fmtKc(S.svc.orig||origPrice(S.svc.price))}));
  pr.appendChild(el("span",{cls:"summary-sale",txt:fmtKc(S.svc.price)}));
  pr.appendChild(el("span",{cls:"summary-badge",txt:tx().sale}));
  sum.appendChild(pr);
  w.appendChild(sum);
  [[tx().name,"text",tx().namePh,"name"],[tx().phone,"tel",tx().phonePh,"phone"],[tx().email,"email",tx().emailPh,"email"]].forEach(([lbl,type,ph,key])=>{
    const fg=el("div",{cls:"fg"});
    fg.appendChild(el("label",{cls:"fl",txt:lbl}));
    const inp=el("input",{cls:"fi",type,placeholder:ph});
    inp.value=S.form[key]||"";
    inp.addEventListener("input",()=>{
      if(key==="phone"){
        // Allow only digits and limit to 9 digits for Czech phone numbers
        let val=inp.value.replace(/\D/g,"").slice(0,9);
        // Format as xxx xxx xxx
        if(val.length>0){
          val=val.slice(0,3)+(val.length>3?" "+val.slice(3,6):"")+(val.length>6?" "+val.slice(6,9):"");
        }
        inp.value=val;
        S.form[key]=val.replace(/\s/g,"");
      }else{
        S.form[key]=inp.value;
      }
    });
    fg.appendChild(inp);
    w.appendChild(fg);
  });
  const nfg=el("div",{cls:"fg"});
  nfg.appendChild(el("label",{cls:"fl",txt:tx().note}));
  const ta=el("textarea",{cls:"fi",placeholder:tx().notePh});
  ta.value=S.form.note||"";
  ta.addEventListener("input",()=>{S.form.note=ta.value});
  nfg.appendChild(ta);
  w.appendChild(nfg);
  w.appendChild(el("div",{cls:"row-r"},el("button",{cls:"btn btn-gold",onclick:async()=>{
    if(!S.form.name.trim()){alert(S.lang==="cs"?"Prosím zadejte jméno":"Please enter your name");return;}
    if(!S.form.phone.trim()||S.form.phone.length!==9){alert(S.lang==="cs"?"Prosím zadejte přesně 9 číslic":"Please enter exactly 9 digits");return;}
    if(!S.form.email.trim()||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(S.form.email)){alert(S.lang==="cs"?"Prosím zadejte platný e-mail":"Please enter a valid email address");return;}
    try{
      await fetch('/api/booking',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          service_category:S.cat.id,
          service_name:n(S.svc),
          client_name:S.form.name,
          client_phone:S.form.phone,
          client_email:S.form.email,
          date:S.date,
          time:S.time,
          note:S.form.note,
          price_original:S.svc.orig||origPrice(S.svc.price),
          price_final:S.svc.price,
          duration:S.svc.dur,
        })
      });
      S.lastRef=mkRef();S.step=5;render();
    }catch(e){console.error(e)}
  }},tx().submit)));
  return w;
}

function s5(){
  const w=el("div",{cls:"ok-wrap"});
  w.appendChild(el("div",{cls:"ok-ring",txt:"✓"}));
  w.appendChild(el("div",{cls:"ok-ttl",txt:tx().okTtl}));
  w.appendChild(el("div",{cls:"ok-ref",htm:tx().okRef+": <strong>"+S.lastRef+"</strong>"}));
  w.appendChild(el("div",{cls:"ok-note",txt:tx().okNote}));
  w.appendChild(el("button",{cls:"btn btn-gold",onclick:()=>{
    S.step=1;S.cat=null;S.svc=null;S.date="";S.time="";S.form={name:"",phone:"",email:"",note:""};render();
  }},tx().newBook));
  return w;
}

// Pre-select category from URL ?cat=massage etc.
const _urlCat=new URLSearchParams(location.search).get('cat');
if(_urlCat){const _c=T[S.lang].cats.find(c=>c.id===_urlCat);if(_c){S.cat=_c;S.step=2;}}

render();
loadServices();
</script>
